################################################################################
# Traefik Ingress Routes — k3s built-in ingress controller
#
# Replace 'payroll.yourdomain.com' with your actual domain everywhere.
#
# Two sections:
#   1. Standard Kubernetes Ingress (works with Traefik v2 in k3s)
#   2. Traefik-specific IngressRoute CRDs (more control, HTTPS redirect)
################################################################################

# ── Section 1: Standard Kubernetes Ingress ────────────────────────────────────
# Routes all /api/* to the Node.js server, everything else to the React client.
# Traefik automatically serves this via its built-in Kubernetes Ingress provider.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payroll-ingress
  namespace: payroll
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: payroll-https-redirect@kubernetescrd
    # If you have a cert-manager or Let's Encrypt TLS cert, add:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  labels:
    app.kubernetes.io/name: enterprise-payroll
spec:
  # Uncomment tls block after SSL is configured:
  # tls:
  #   - hosts:
  #       - payroll.yourdomain.com
  #     secretName: payroll-tls
  rules:
    - host: payroll.yourdomain.com
      http:
        paths:
          # API routes → Node.js server
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 5005
          # All other routes → React client (SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 8080

---
# ── Section 2: Traefik Middleware — HTTPS redirect ────────────────────────────

apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: payroll
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# ── Section 3: Traefik IngressRoute for HTTP (redirects to HTTPS) ─────────────

apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: payroll-http
  namespace: payroll
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`payroll.yourdomain.com`)
      kind: Rule
      middlewares:
        - name: https-redirect
      services:
        - name: client
          port: 8080

---
# ── Section 4: Traefik IngressRoute for HTTPS ─────────────────────────────────

apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: payroll-https
  namespace: payroll
spec:
  entryPoints:
    - websecure
  routes:
    # API routes → Node.js backend
    - match: Host(`payroll.yourdomain.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: server
          port: 5005
    # All other routes → React frontend
    - match: Host(`payroll.yourdomain.com`)
      kind: Rule
      services:
        - name: client
          port: 8080
  # Uncomment after SSL cert is ready:
  # tls:
  #   secretName: payroll-tls
