################################################################################
# React + Nginx Client — Deployment + ClusterIP Service
# Image: your-registry/payroll-client:latest
# Container port: 8080 (nginx non-root)
################################################################################

apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: payroll
  labels:
    app: payroll-client
    app.kubernetes.io/name: enterprise-payroll
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: payroll-client

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-client
  namespace: payroll
  labels:
    app: payroll-client
    app.kubernetes.io/name: enterprise-payroll
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payroll-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # Zero-downtime rolling updates

  template:
    metadata:
      labels:
        app: payroll-client
    spec:
      containers:
        - name: client
          image: YOUR_REGISTRY/payroll-client:latest   # Replace with your Docker registry image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
