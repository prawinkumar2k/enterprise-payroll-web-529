apiVersion: v1
kind: ConfigMap
metadata:
  name: payroll-config
  namespace: payroll
  labels:
    app.kubernetes.io/name: enterprise-payroll
data:
  # Server config
  NODE_ENV: "production"
  PORT: "5005"
  HOST: "0.0.0.0"

  # Database config
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_USER: "root"
  BILLING_DB: "billing_db"

  # CORS - update with your actual domain
  ALLOWED_ORIGINS: "http://localhost,https://payroll.yourdomain.com"

  # MySQL init config
  MYSQL_DATABASE: "billing_db"
  MYSQL_USER: "root"
