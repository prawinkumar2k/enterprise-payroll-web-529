################################################################################
# Node.js API Server — Deployment + ClusterIP Service
# Image: your-registry/payroll-server:latest
# Port: 5005
################################################################################

apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: payroll
  labels:
    app: payroll-server
    app.kubernetes.io/name: enterprise-payroll
spec:
  type: ClusterIP
  ports:
    - port: 5005
      targetPort: 5005
      protocol: TCP
      name: http-api
  selector:
    app: payroll-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-server
  namespace: payroll
  labels:
    app: payroll-server
    app.kubernetes.io/name: enterprise-payroll
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payroll-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # Zero-downtime rolling updates

  template:
    metadata:
      labels:
        app: payroll-server
    spec:
      # Wait for MySQL to be ready before starting
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL at mysql:3306...";
                sleep 3;
              done;
              echo "MySQL is ready."

      containers:
        - name: server
          image: YOUR_REGISTRY/payroll-server:latest   # Replace with your Docker registry image
          imagePullPolicy: Always
          ports:
            - containerPort: 5005
              name: http-api

          envFrom:
            - configMapRef:
                name: payroll-config

          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: payroll-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payroll-secrets
                  key: JWT_SECRET

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5005
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5005
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

          volumeMounts:
            - name: server-logs
              mountPath: /app/logs
            - name: server-data
              mountPath: /app/data

      volumes:
        - name: server-logs
          emptyDir: {}
        - name: server-data
          persistentVolumeClaim:
            claimName: server-data-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: server-data-pvc
  namespace: payroll
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path     # k3s default StorageClass
  resources:
    requests:
      storage: 1Gi
