user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enterprise Hardening: Disable Server Tokens
    server_tokens off;

    # Performance: Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream to private backend
    upstream app_backend {
        server backend:5005;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard Redirect to HTTPS (optional but recommended in real prod)
        # return 301 https://$host$request_uri;

        # Main API Proxy
        location /api {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Security Headers (Phase 2 hardening)
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header X-XSS-Protection "1; mode=block";
        }

        # Frontend Serving (assuming proxy serves compiled React)
        location / {
            proxy_pass http://backend; # In this setup, backend serves dist
            proxy_set_header Host $host;
        }
    }
}
