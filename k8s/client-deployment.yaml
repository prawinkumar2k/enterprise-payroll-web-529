# ── Client Deployment (Frontend Nginx serving React SPA) ──────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-client
  namespace: payroll
  labels:
    app: payroll-client
    tier: frontend
spec:
  replicas: 2          # Stateless — scale freely for high traffic
  selector:
    matchLabels:
      app: payroll-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: payroll-client
        tier: frontend
    spec:
      securityContext:
        runAsUser: 101    # nginx user
        runAsGroup: 101
      containers:
        - name: client
          image: localhost:5000/payroll-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
# ── Client Service ────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: payroll-client-svc
  namespace: payroll
spec:
  selector:
    app: payroll-client
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
