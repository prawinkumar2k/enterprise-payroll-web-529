# ── Kubernetes Secrets (MySQL-Only Mode) ───────────────────────
# IMPORTANT: Replace ALL values below with real secrets before deploying!
# Generate secrets: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
# ── DO NOT commit real secrets to git ──────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: payroll-secrets
  namespace: payroll
type: Opaque
stringData:
  # ── Server ──
  NODE_ENV: "production"
  PORT: "5005"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"

  # ── MySQL Database ──
  DB_HOST: "payroll-mysql-svc"
  DB_PORT: "3306"
  DB_USER: "root"
  DB_PASSWORD: "CHANGE_ME_STRONG_DB_PASSWORD"
  DB_NAME: "billing_db"
  DISABLE_MYSQL: "false"

  # ── Security ──
  JWT_SECRET: "CHANGE_ME_GENERATE_64_HEX_CHARS"
  JWT_EXPIRES_IN: "90d"
  ENCRYPTION_KEY: "CHANGE_ME_GENERATE_64_HEX_CHARS_2"

  # ── CORS ──
  ALLOWED_ORIGINS: "http://72.61.229.231,https://72.61.229.231"

  # ── Tax / Feature ──
  PT_STATE: "TN"
  SAFE_MODE: "false"
