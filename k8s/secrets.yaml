# ── NOTE: Replace base64 values below!
# Generate: echo -n 'my-value' | base64
# Apply:    kubectl apply -f secrets.yaml -n payroll
# ─── DO NOT commit real secrets to git ──────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: payroll-secrets
  namespace: payroll
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_USE_STRONG_SECRET_64CHARS"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  NODE_ENV: "production"
  PORT: "5001"
  HOST: "0.0.0.0"
  DATA_PATH: "/app/data"
  LOG_LEVEL: "info"
  JWT_EXPIRES_IN: "90d"
  ALLOWED_ORIGINS: "https://payroll.yourdomain.com"
