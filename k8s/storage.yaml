# ── Persistent Storage for Enterprise Payroll (MySQL-Only) ─────

# ── MySQL Data Volume ──────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-data-pv
  labels:
    type: local
    app: payroll-mysql
spec:
  storageClassName: manual-mysql
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /opt/payroll/mysql-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
  namespace: payroll
spec:
  storageClassName: manual-mysql
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  selector:
    matchLabels:
      type: local
      app: payroll-mysql
---
# ── Backups Volume ─────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backups-pv
  labels:
    type: local
    app: payroll-backup
spec:
  storageClassName: manual-backup
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /opt/payroll/backups
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups-pvc
  namespace: payroll
spec:
  storageClassName: manual-backup
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  selector:
    matchLabels:
      type: local
      app: payroll-backup
