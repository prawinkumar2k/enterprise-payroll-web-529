# ── MySQL Deployment (Primary Database) ───────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-mysql
  namespace: payroll
  labels:
    app: payroll-mysql
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll-mysql
  strategy:
    type: Recreate   # MySQL cannot run 2 replicas on same volume
  template:
    metadata:
      labels:
        app: payroll-mysql
        tier: database
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payroll-secrets
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: payroll-secrets
                  key: DB_NAME
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-pvc
        - name: init-sql
          configMap:
            name: mysql-init-sql
---
# ── MySQL Service ─────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: payroll-mysql-svc
  namespace: payroll
spec:
  selector:
    app: payroll-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  type: ClusterIP
