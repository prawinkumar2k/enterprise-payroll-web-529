# ── Traefik IngressRoute (k3s default ingress controller) ─────
# Replace payroll.yourdomain.com with your real domain or use IP
# TLS cert provisioned automatically by Traefik + Let's Encrypt
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: payroll-ingress
  namespace: payroll
spec:
  entryPoints:
    - websecure
  routes:
    # ── API → backend server ──────────────────────────────
    - match: Host(`payroll.yourdomain.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: payroll-server-svc
          port: 5001
    # ── Frontend ─────────────────────────────────────────
    - match: Host(`payroll.yourdomain.com`)
      kind: Rule
      services:
        - name: payroll-client-svc
          port: 8080
  tls:
    certResolver: letsencrypt        # configured in Traefik startup
---
# ── HTTP → HTTPS redirect ─────────────────────────────────────
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: payroll-ingress-http
  namespace: payroll
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`payroll.yourdomain.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: payroll-client-svc
          port: 8080
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: payroll
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
